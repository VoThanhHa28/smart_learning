version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_learning_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:cached
    depends_on:
      - milvus
      - ocr
    environment:
      - OCR_SERVICE_URL=http://ocr:9000/ocr
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - EMBED_BATCH=32
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
    restart: unless-stopped

  ocr:
    build:
      context: ./ocr_service
      dockerfile: Dockerfile
    container_name: smart_learning_ocr
    ports:
      - "9100:9000"
    volumes:
      - ./ocr_service:/app:cached
    runtime: nvidia
    environment:
      - OCR_DEVICE=gpu
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 6G
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - ./volumes/etcd:/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.9
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      COMMON_SECURITY_AUTHENTICATION_ENABLED: false
      DATA_COORD_MAX_SEND_SIZE: 32
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    shm_size: "2gb"
    restart: unless-stopped

networks:
  default:
    name: smart_learning_net
